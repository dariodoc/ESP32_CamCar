[platformio]
default_envs = ota_upload

[env]
platform = espressif32
framework = arduino
board = freenove_esp32_wrover

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2
    ; 👇 Configuración óptima para AsyncTCP / WebSockets bajo alta carga
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_USE_WDT=0

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Asegura que la PSRAM externa corra también a alta velocidad (80MHz)
board_build.f_psram = 80000000L 

board_build.partitions = min_spiffs.csv

[env:serial_upload]
upload_port = COM5
monitor_port = COM5

[env:ota_upload]
upload_protocol = espota
upload_port = 192.168.4.1