[platformio]
default_envs = ota_upload

[env]
platform = espressif32
framework = arduino
board = freenove_esp32_wrover

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -O3
    -ffast-math                              ; Acelera operaciones float (sin/cos Mecanum)
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CONFIG_ARDUINO_RUNNING_CORE=1        ; Core 1 para Arduino / Motores / Servos
    -D CORE_DEBUG_LEVEL=0                   ; Desactiva logs para ahorrar ciclos de CPU y RAM

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; PSRAM a máxima frecuencia (80MHz)
board_build.f_psram = 80000000L 

board_build.partitions = min_spiffs.csv

lib_deps = 
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    adafruit/Adafruit GFX Library @ ^1.11.9 



[env:serial_upload]
upload_port = COM8
monitor_port = COM8

[env:ota_upload]
upload_protocol = espota
upload_port = 192.168.0.202
upload_flags = 
    --timeout=60
    --host_port=32333