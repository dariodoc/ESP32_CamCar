<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body scroll="no" class="noselect"
    style="background-color:white; position:relative; overflow:auto; text-align: center;">

    <img id="CameraImage" src="">

    <br>

    <canvas id="Canvas" name="game" style="background-color:rgb(4 3 20 / 40%);"></canvas>

    <table id="MainTable" style="width:345px; margin:auto; table-layout:fixed" cellspacing=10>


        <tr>
            <td style="text-align:left"><b>Pan:</b></td>

            <td class="button" id="btnPanLeft"><span class="arrows">&#9664;</span></td>
            <td class="button" id="btnPanRight"><span class="arrows">&#9654;</span></td>

        </tr>
        <tr>
            <td style="text-align:left"><b>Tilt:</b></td>

            <td class="button" id="btnTiltUp"><span class="arrows">&#9650;</span></td>
            <td class="button" id="btnTiltDown"><span class="arrows">&#9660;</span></td>
        </tr>
        <tr>
            <td class="button" id="btnLight"><span class="arrows">&#128262;</span></td>
            <td class="button" id="btnCenterServos"><span class="arrows">&#9678;</span></td>
            <td class="button" id="btnMelody"><span class="arrows">&#127925;</span></td>
        </tr>
        <tr>
            <td></td>
            <td class="button" id="btnObstacleAvoidance"><span class="arrows">&#128225;</span></td>
            <td></td>
        </tr>

    </table>

    <script>
        ///////////////////////// VARIABLES //////////////////////////////
        let width, height, radius, x_orig, y_orig;
        let coord = { x: 0, y: 0 };
        let paint = false;

        let webSocketCarInputUrl = "ws://" + window.location.hostname + "/CarInput";
        let websocketCarInput;

        let isMelodyOn = false;
        let isLightOn = false;
        let isObstacleAvoidanceOn = false;
        let currentDirection = 0;

        let panState = 0;  // -1: Izquierda, 0: Detenido, 1: Derecha
        let tiltState = 0; // -1: Arriba,    0: Detenido, 1: Abajo

        let lastSendTime = 0;

        const btnObstacleAvoidance = document.getElementById("btnObstacleAvoidance");
        const btnLight = document.getElementById("btnLight");
        const btnMelody = document.getElementById("btnMelody");
        const btnCenterServos = document.getElementById("btnCenterServos");
        const canvas = document.getElementById("Canvas");
        const ctx = canvas.getContext("2d");
        const mainTable = document.getElementById("MainTable");
        const cameraImage = document.getElementById("CameraImage");

        const btnPanLeft = document.getElementById("btnPanLeft");
        const btnPanRight = document.getElementById("btnPanRight");
        const btnTiltUp = document.getElementById("btnTiltUp");
        const btnTiltDown = document.getElementById("btnTiltDown");

        const FORWARD = 1, BACKWARD = 2, LEFT = 3, RIGHT = 4, STOP = 0;
        const FORWARDLEFT = 5, FORWARDRIGHT = 6, BACKLEFT = 7, BACKRIGHT = 8;

        //////////////////////////////// CÁMARA WEBSOCKET BINARIO ////////////////////////////////

        let websocketCamera;
        let currentFrameUrl = null;

        function initCameraStream() {
            const wsCameraUrl = "ws://" + window.location.hostname + "/CameraStream";
            websocketCamera = new WebSocket(wsCameraUrl);

            websocketCamera.binaryType = "arraybuffer";

            websocketCamera.onopen = function () {
                console.log("Camera WebSocket connected");
            };

            websocketCamera.onmessage = function (event) {
                const blob = new Blob([event.data], { type: "image/jpeg" });

                if (currentFrameUrl) {
                    URL.revokeObjectURL(currentFrameUrl);
                }

                currentFrameUrl = URL.createObjectURL(blob);
                cameraImage.src = currentFrameUrl;
            };

            websocketCamera.onclose = function () {
                setTimeout(initCameraStream, 1000);
            };

            websocketCamera.onerror = function (err) {
                if (websocketCamera) websocketCamera.close();
            };
        }

        //////////////////////////////// WEBSOCKET CAR INPUT ////////////////////////////////

        function initCarInputWebSocket() {
            websocketCarInput = new WebSocket(webSocketCarInputUrl);

            websocketCarInput.onopen = function () {
                console.log('CarInput WebSocket connected');
            };

            websocketCarInput.onclose = function () {
                setTimeout(initCarInputWebSocket, 2000);
            };

            websocketCarInput.onmessage = function (event) {
                try {
                    const telemetry = JSON.parse(event.data);
                    if (telemetry.obstacle !== undefined) {
                        canvas.style.border = telemetry.obstacle ? "3px solid red" : "none";
                    }
                } catch (e) { }
            };
        }

        function sendCommand(command, value) {
            if (websocketCarInput && websocketCarInput.readyState === WebSocket.OPEN) {
                if (websocketCarInput.bufferedAmount < 1024) {
                    const cmdChar = (typeof command === 'string') ? command.charCodeAt(0) : command;
                    const data = new Uint8Array([cmdChar, parseInt(value)]);
                    websocketCarInput.send(data);
                }
            }
        }

        //////////////// CONTROL DE SERVOS OPTIMIZADO (OPCIÓN B) //////////////////

        function PanLeftStart() {
            if (panState !== 1) {
                panState = 1;
                btnPanLeft.style.backgroundColor = "rgb(236 240 243)";
                sendCommand('P', 1); // 'P' 1 = Mover Izquierda
            }
        }

        function PanRightStart() {
            if (panState !== 2) {
                panState = 2;
                btnPanRight.style.backgroundColor = "rgb(236 240 243)";
                sendCommand('P', 2); // 'P' 2 = Mover Derecha
            }
        }

        function stopPan() {
            if (panState !== 0) {
                panState = 0;
                btnPanLeft.style.backgroundColor = 'black';
                btnPanRight.style.backgroundColor = 'black';
                sendCommand('P', 0); // 'P' 0 = Detener
            }
        }

        function TiltUpStart() {
            if (tiltState !== 1) {
                tiltState = 1;
                btnTiltUp.style.backgroundColor = "rgb(236 240 243)";
                sendCommand('T', 1); // 'T' 1 = Mover Arriba
            }
        }

        function TiltDownStart() {
            if (tiltState !== 2) {
                tiltState = 2;
                btnTiltDown.style.backgroundColor = "rgb(236 240 243)";
                sendCommand('T', 2); // 'T' 2 = Mover Abajo
            }
        }

        function stopTilt() {
            if (tiltState !== 0) {
                tiltState = 0;
                btnTiltUp.style.backgroundColor = 'black';
                btnTiltDown.style.backgroundColor = 'black';
                sendCommand('T', 0); // 'T' 0 = Detener
            }
        }

        function stopAllServos() {
            stopPan();
            stopTilt();
        }

        function CenterServos() {
            stopAllServos();
            sendCommand('C', 1);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function ObstacleAvoidanceOnOff() {
            isObstacleAvoidanceOn = !isObstacleAvoidanceOn;
            btnObstacleAvoidance.style.backgroundColor = isObstacleAvoidanceOn ? "rgb(236 240 243)" : 'black';
            sendCommand('O', 1);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function LightOnOff() {
            isLightOn = !isLightOn;
            btnLight.style.backgroundColor = isLightOn ? "rgb(236 240 243)" : 'black';
            sendCommand('L', 1);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function MelodyOnOff() {
            isMelodyOn = !isMelodyOn;
            btnMelody.style.backgroundColor = isMelodyOn ? "rgb(236 240 243)" : 'black';
            sendCommand('H', 1);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function setupButtonEvents(element, startFn, isToggle = false) {
            if (isToggle) {
                const handlePress = (e) => {
                    e.preventDefault();
                    startFn();
                };
                element.addEventListener('touchstart', handlePress, { passive: false });
                element.addEventListener('mousedown', handlePress);
            } else {
                const handleStart = (e) => {
                    e.preventDefault();
                    startFn();
                };
                const handleEnd = (e) => {
                    e.preventDefault();
                    stopAllServos();
                };

                element.addEventListener('touchstart', handleStart, { passive: false });
                element.addEventListener('touchend', handleEnd, { passive: false });
                element.addEventListener('touchcancel', handleEnd, { passive: false });

                element.addEventListener('mousedown', handleStart);
                element.addEventListener('mouseup', handleEnd);
                element.addEventListener('mouseleave', handleEnd);
            }
        }

        //////////////////// JOYSTICK BINARIO (20 Hz / 8 Bytes) ////////////////////////////

        let lastSentX = 0, lastSentY = 0;

        function background() {
            x_orig = width / 2;
            y_orig = height / 2;
            ctx.beginPath();
            ctx.arc(x_orig, y_orig, radius + 20, 0, Math.PI * 2, true);
            ctx.fillStyle = '#ECE5E5';
            ctx.fill();
        }

        function joystick(w, h) {
            ctx.beginPath();
            ctx.arc(w, h, radius, 0, Math.PI * 2, true);
            ctx.fillStyle = '#e31414';
            ctx.fill();
            ctx.strokeStyle = '#F6ABAB';
            ctx.lineWidth = 8;
            ctx.stroke();
        }

        function resize() {
            width = 345;
            radius = 30;
            height = radius * 4.5;
            ctx.canvas.width = width;
            ctx.canvas.height = height;
            background();
            joystick(width / 2, height / 2);
        }

        function getPosition(event) {
            const rect = canvas.getBoundingClientRect();
            const mouse_x = event.clientX || (event.touches && event.touches[0].clientX);
            const mouse_y = event.clientY || (event.touches && event.touches[0].clientY);
            coord.x = mouse_x - rect.left;
            coord.y = mouse_y - rect.top;
        }

        function Draw(event) {
            if (event.cancelable) event.preventDefault();
            if (!paint) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX || (event.touches && event.touches[0].clientX);
            const mouseY = event.clientY || (event.touches && event.touches[0].clientY);

            let dx = mouseX - rect.left - x_orig;
            let dy = mouseY - rect.top - y_orig;
            let distance = Math.sqrt(dx * dx + dy * dy);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            background();

            let x, y;
            if (distance <= radius) {
                x = mouseX - rect.left;
                y = mouseY - rect.top;
            } else {
                let angleRad = Math.atan2(dy, dx);
                x = x_orig + radius * Math.cos(angleRad);
                y = y_orig + radius * Math.sin(angleRad);
            }
            joystick(x, y);

            // Normalización entre -1.0 y 1.0 (X = giro, Y = avance/reversa)
            let normX = parseFloat(((x - x_orig) / radius).toFixed(2));
            let normY = parseFloat((-(y - y_orig) / radius).toFixed(2)); // Invertido para que Arriba sea positivo

            sendJoystickBinary(normX, normY);
        }

        function sendJoystickBinary(x, y, force = false) {
            // Zona muerta en JS
            if (Math.abs(x) < 0.08) x = 0.0;
            if (Math.abs(y) < 0.08) y = 0.0;

            let currentTime = Date.now();

            // 🚀 TRANSMISIÓN CONTINUA: Envía si cambio la posición, si se fuerza (Stop), 
            // o si han pasado 50 ms MIENTRAS se mantenga presionado el joystick (paint == true)
            if (force || (x !== lastSentX || y !== lastSentY) || (paint && currentTime - lastSendTime >= 50)) {
                if (websocketCarInput && websocketCarInput.readyState === WebSocket.OPEN) {
                    const buffer = new ArrayBuffer(8);
                    const view = new DataView(buffer);
                    view.setFloat32(0, x, true); // Little-Endian
                    view.setFloat32(4, y, true);
                    websocketCarInput.send(buffer);

                    lastSentX = x;
                    lastSentY = y;
                    lastSendTime = currentTime;
                }
            }
        }

        function startDrawing(event) {
            if (event.cancelable) event.preventDefault();
            paint = true;
            getPosition(event);
            Draw(event);
        }

        function stopDrawing(event) {
            if (event && event.cancelable) event.preventDefault();

            paint = false;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            background();
            joystick(width / 2, height / 2);

            // Enviar Parada (0, 0) forzada
            sendJoystickBinary(0.0, 0.0, true);
        }

        //////////////////////////////////////////////////////////////////////////

        function initFunction() {
            resize();
            initCameraStream();
            initCarInputWebSocket();

            // 🛑 PARADA DE EMERGENCIA INSTANTÁNEA
            window.addEventListener('beforeunload', () => {
                if (websocketCamera) websocketCamera.close();
                if (websocketCarInput) {
                    sendJoystickBinary(0.0, 0.0, true);
                    websocketCarInput.close();
                }
            });

            setupButtonEvents(btnPanLeft, PanLeftStart);
            setupButtonEvents(btnPanRight, PanRightStart);
            setupButtonEvents(btnTiltUp, TiltUpStart);
            setupButtonEvents(btnTiltDown, TiltDownStart);

            setupButtonEvents(btnLight, LightOnOff, true);
            setupButtonEvents(btnCenterServos, CenterServos, true);
            setupButtonEvents(btnMelody, MelodyOnOff, true);
            setupButtonEvents(btnObstacleAvoidance, ObstacleAvoidanceOnOff, true);

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mousemove', Draw);

            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchend', stopDrawing, { passive: false });
            canvas.addEventListener('touchcancel', stopDrawing, { passive: false });
            canvas.addEventListener('touchmove', Draw, { passive: false });

            window.addEventListener('resize', resize);

            window.addEventListener('mouseup', stopAllServos);
            window.addEventListener('touchend', stopAllServos);
            window.addEventListener('touchcancel', stopAllServos);
        }

        window.onload = initFunction;
    </script>
</body>

</html>
