<!DOCTYPE html>
<html>

<head>
  <!-- 🚀 FIX DE ENCODING UTF-8 -->
  <meta charset="UTF-8">
  <title>ESP Wi-Fi Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" type="text/css" href="wifimanager.css">
</head>

<body>
  <div class="topnav">
    <h1>ESP Wi-Fi Manager</h1>
  </div>
  <div class="content">
    <div class="card-grid">
      <div class="card">
        <form action="/save" method="POST">
          <p>
            <label for="ssid">SSID</label>
            <select id="ssid" name="ssid" required>
              <option value="" disabled selected>Buscando redes...</option>
            </select><br>

            <label for="pass">Password</label>
            <input type="password" id="pass" name="pass" placeholder="Contraseña"><br>

            <label for="ip">IP Address</label>
            <input type="text" id="ip" name="ip" value="192.168.0.202"><br>

            <label for="gateway">Gateway Address</label>
            <input type="text" id="gateway" name="gateway" value="192.168.0.1"><br>

            <input type="submit" value="Submit">
          </p>
        </form>
      </div>
    </div>
  </div>
  <script>
    fetch('/scan')
      .then(response => response.json())
      .then(data => {
        const select = document.getElementById('ssid');
        select.innerHTML = ''; // Limpiar opcion de busqueda
        if (data.length === 0) {
          select.innerHTML = '<option value="" disabled selected>No se encontraron redes</option>';
          return;
        }
        select.innerHTML = '<option value="" disabled selected>Selecciona tu red...</option>';
        data.forEach(net => {
          if(net.ssid) {
            const option = document.createElement('option');
            option.value = net.ssid;
            option.textContent = net.ssid + " (" + net.rssi + " dBm)";
            select.appendChild(option);
          }
        });
      })
      .catch(err => console.error("Error cargando redes", err));
  </script>
</body>

</html>
